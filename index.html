<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحادثة السحابي - واتساب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* هيدر التطبيق */
        .chat-header { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; z-index: 10; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .group-avatar { width: 40px; height: 40px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 18px; }
        .group-info h2 { font-size: 16px; color: #f1f1f2; }
        .group-info p { font-size: 12px; color: #8696a0; }

        /* أزرار تحكم الأدمن */
        .admin-controls { display: flex; gap: 8px; }
        .admin-btn { background-color: #2a3942; border: none; color: #00a884; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; transition: 0.2s; }
        .admin-btn:hover { background-color: #374248; }

        /* صندوق الرسائل */
        .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 24px 24px; }
        
        /* تصميم الرسالة */
        .message { max-width: 70%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.3); }
        .message.incoming { background-color: #202c33; align-self: flex-start; border-top-right-radius: 0; }
        .message.outgoing { background-color: #005c4b; align-self: flex-end; border-top-left-radius: 0; }
        
        .message .sender { font-size: 12px; color: #53bdeb; margin-bottom: 3px; display: block; font-weight: bold; }
        .message .content { margin-bottom: 14px; line-height: 1.4; }
        .message .footer-info { position: absolute; bottom: 4px; left: 8px; display: flex; align-items: center; gap: 4px; }
        .message .time { font-size: 10px; color: #8696a0; }
        
        /* خيارات الحذف والتعديل داخل الرسالة */
        .msg-actions { display: none; gap: 6px; margin-right: 6px; }
        .message:hover .msg-actions { display: inline-flex; }
        .msg-actions button { background: none; border: none; color: #8696a0; cursor: pointer; font-size: 10px; }
        .msg-actions button:hover { color: #f1f1f2; }

        /* شريط الكتابة السفلي */
        .chat-input-area { background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
        .chat-input-area input { flex: 1; background-color: #2a3942; border: none; padding: 12px 16px; border-radius: 8px; color: #f1f1f2; font-size: 14px; outline: none; }
        .chat-input-area input::placeholder { color: #8696a0; }
        .send-btn { background-color: #00a884; border: none; color: white; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; }
        .send-btn:hover { background-color: #008f72; }

        /* نافذة منبثقة (Modal) لإضافة أعضاء */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background-color: #202c33; padding: 20px; border-radius: 12px; width: 300px; display: flex; flex-direction: column; gap: 12px; border: 1px solid #222d34; }
        .modal-content h3 { color: #f1f1f2; font-size: 16px; }
        .modal-content input { background-color: #2a3942; border: none; padding: 10px; border-radius: 6px; color: #fff; outline: none; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-actions button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-save { background: #00a884; color: white; }
        .btn-cancel { background: #374248; color: #fff; }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <div class="chat-header">
        <div class="header-left">
            <div class="group-avatar">ع</div>
            <div class="group-info">
                <h2>قروب العائلة ❤️</h2>
                <p id="membersCount">الأعضاء: 3 نشطين</p>
            </div>
        </div>
        <div class="admin-controls">
            <button class="admin-btn" onclick="openAddMemberModal()">➕ إضافة عضو</button>
            <button class="admin-btn" onclick="toggleUserRole()" id="roleBtn">وضع الأدمن: مفعل</button>
        </div>
    </div>

    <!-- صندوق الرسائل -->
    <div class="chat-messages" id="messagesContainer">
        <!-- رسائل تجريبية -->
        <div class="message incoming" data-id="1" data-user="سامي">
            <span class="sender">سامي</span>
            <div class="content">امين يارب</div>
            <div class="footer-info">
                <span class="time">1:07 م</span>
            </div>
        </div>
        <div class="message outgoing" data-id="2" data-user="عبدالرحمن">
            <span class="sender">عبدالرحمن (أدمن)</span>
            <div class="content">حياكم الله جميعاً في القروب الجديد.</div>
            <div class="footer-info">
                <span class="time">1:15 م</span>
                <span class="msg-actions">
                    <button onclick="editMessage(this)">تعديل</button>
                    <button onclick="deleteMessage(this)">حذف</button>
                </span>
            </div>
        </div>
    </div>

    <!-- شريط الإرسال -->
    <div class="chat-input-area">
        <input type="text" id="messageInput" placeholder="اكتب رسالة..." onkeypress="checkEnter(event)">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <!-- نافذة إضافة عضو -->
    <div class="modal" id="memberModal">
        <div class="modal-content">
            <h3>إضافة عضو جديد للقروب</h3>
            <input type="text" id="newMemberName" placeholder="اسم العضو الجديد...">
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeAddMemberModal()">إلغاء</button>
                <button class="btn-save" onclick="addMember()">إضافة</button>
            </div>
        </div>
    </div>

    <script>
        let isAdmin = true; 
        let currentUser = "عبدالرحمن";
        let membersList = ["سامي", "عبدالرحمن", "خالد عويمر"];

        function toggleUserRole() {
            isAdmin = !isAdmin;
            currentUser = isAdmin ? "عبدالرحمن" : "عضو عادي";
            document.getElementById('roleBtn').innerText = isAdmin ? "وضع الأدمن: مفعل" : "وضع الأدمن: معطل";
            alert("تم تبديل الصلاحية إلى: " + (isAdmin ? "أدمن (مشرف)" : "عضو عادي"));
        }

        function openAddMemberModal() {
            if(!isAdmin) {
                alert("عذراً، هذه الصلاحية مخصصة للأدمن فقط!");
                return;
            }
            document.getElementById('memberModal').style.display = 'flex';
        }

        function closeAddMemberModal() {
            document.getElementById('memberModal').style.display = 'none';
        }

        function addMember() {
            const nameInput = document.getElementById('newMemberName');
            if(nameInput.value.trim() === '') return;
            membersList.push(nameInput.value.trim());
            document.getElementById('membersCount').innerText = `الأعضاء: ${membersList.length} نشطين`;
            nameInput.value = '';
            closeAddMemberModal();
            alert("تمت إضافة العضو بنجاح!");
        }

        function checkEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const container = document.getElementById('messagesContainer');
            if(input.value.trim() === '') return;

            const msgId = Date.now();
            const msgDiv = document.createElement('div');
            msgDiv.className = isAdmin ? 'message outgoing' : 'message incoming';
            msgDiv.setAttribute('data-id', msgId);
            msgDiv.setAttribute('data-user', currentUser);
            
            msgDiv.innerHTML = `
                <span class="sender">${currentUser} ${isAdmin ? '(أدمن)' : ''}</span>
                <div class="content">${input.value}</div>
                <div class="footer-info">
                    <span class="time">الآن</span>
                    <span class="msg-actions">
                        <button onclick="editMessage(this)">تعديل</button>
                        <button onclick="deleteMessage(this)">حذف</button>
                    </span>
                </div>
            `;
            container.appendChild(msgDiv);
            input.value = '';
            container.scrollTop = container.scrollHeight;
        }

        function deleteMessage(btn) {
            const msgDiv = btn.closest('.message');
            const msgUser = msgDiv.getAttribute('data-user');
            
            if (isAdmin || msgUser === currentUser) {
                if(confirm("هل تريد حذف هذه الرسالة؟")) {
                    msgDiv.remove();
                }
            } else {
                alert("لا يمكنك حذف رسائل الآخرين!");
            }
        }

        function editMessage(btn) {
            const msgDiv = btn.closest('.message');
            const msgUser = msgDiv.getAttribute('data-user');
            const contentDiv = msgDiv.querySelector('.content');

            if (msgUser === currentUser || isAdmin) {
                const newText = prompt("تعديل الرسالة:", contentDiv.innerText);
                if(newText !== null && newText.trim() !== "") {
                    contentDiv.innerText = newText;
                }
            } else {
                alert("يمكنك تعديل رسائلك الخاصة فقط!");
            }
        }
    </script>
</body>
</html>
