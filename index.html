<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حلول تمارين كتاب الرياضيات - سادس ابتدائي ف1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; background-color: #0b141a; color: #e9edef; overflow: hidden; position: fixed; }
        
        .app-container { display: flex; flex-direction: column; height: 100%; width: 100%; }

        /* الهيدر */
        .chat-header { background-color: #202c33; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #222d34; z-index: 10; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .group-avatar { width: 38px; height: 38px; background: #00a884; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; font-size: 16px; }
        .group-info h2 { font-size: 14px; color: #f1f1f2; }
        .group-info p { font-size: 11px; color: #8696a0; }

        .header-actions { display: flex; align-items: center; gap: 4px; }
        .admin-btn { background-color: #2a3942; border: none; color: #00a884; padding: 5px 7px; border-radius: 6px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .search-box { background: #2a3942; border: none; padding: 5px 6px; border-radius: 6px; color: #fff; font-size: 11px; outline: none; width: 65px; }

        /* صندوق المحتوى */
        .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background-color: #0b141a; background-image: radial-gradient(#111b21 1px, transparent 0); background-size: 24px 24px; -webkit-overflow-scrolling: touch; }
        
        .message { max-width: 90%; padding: 10px 14px; border-radius: 8px; font-size: 13px; position: relative; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.3); }
        .message.incoming { background-color: #202c33; align-self: flex-start; border-top-right-radius: 0; }
        .message.outgoing { background-color: #005c4b; align-self: flex-end; border-top-left-radius: 0; }
        
        .message .sender { font-size: 11px; color: #53bdeb; margin-bottom: 3px; display: block; font-weight: bold; }
        .message .content { margin-bottom: 12px; line-height: 1.5; }
        .message .footer-info { position: absolute; bottom: 3px; left: 8px; font-size: 9px; color: #8696a0; }

        /* تصميم صندوق حل التمرين النموذجي */
        .solution-box { background: #111b21; border: 1px solid #2a3942; padding: 10px; border-radius: 8px; margin-top: 6px; }
        .step-item { background: #202c33; padding: 7px 10px; border-radius: 6px; margin-top: 5px; font-size: 12px; border-right: 3px solid #00a884; }
        
        .exercise-btn { background: #202c33; padding: 7px 10px; border-radius: 6px; margin-top: 5px; cursor: pointer; font-size: 12px; display: block; color: #53bdeb; border: 1px solid transparent; text-align: right; width: 100%; }
        .exercise-btn:hover { background: #2a3942; border-color: #00a884; }

        /* شريط الكتابة السفلي */
        .chat-input-area { background-color: #202c33; padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; width: 100%; border-top: 1px solid #222d34; }
        .chat-input-area input { flex: 1; background-color: #2a3942; border: none; padding: 10px 14px; border-radius: 8px; color: #f1f1f2; font-size: 14px; outline: none; }
        .send-btn { background-color: #00a884; border: none; color: white; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر -->
        <div class="chat-header">
            <div class="header-left">
                <div class="group-avatar">ح</div>
                <div class="group-info">
                    <h2>حلول كتاب الرياضيات 📖</h2>
                    <p>الصف السادس - الفصل الدراسي الأول</p>
                </div>
            </div>
            <div class="header-actions">
                <input type="text" class="search-box" id="searchBox" placeholder="بحث تمرين..." onkeyup="filterContent()">
                <button class="admin-btn" onclick="showChapterExercises(1)">فصل 1</button>
                <button class="admin-btn" onclick="showChapterExercises(2)">فصل 2</button>
                <button class="admin-btn" onclick="showChapterExercises(3)">فصل 3</button>
            </div>
        </div>

        <!-- صندوق المحتوى -->
        <div class="chat-messages" id="messagesContainer">
            <div class="message incoming">
                <span class="sender">مساعد حلول الكتاب 🤖</span>
                <div class="content">
                    أهلاً بك يا بطل. اختر الفصل من الأعلى لتظهر لك قائمة بأهم تمارين الكتاب مع **الحل النموذجي والشرح المفصل خطوة بخطوة**، أو اكتب رقم التمرين وسأقوم بحله لك مباشرة!
                </div>
                <div class="footer-info">جاهز للحل</div>
            </div>
        </div>

        <!-- شريط الإرسال -->
        <div class="chat-input-area">
            <input type="text" id="messageInput" placeholder="اكتب رقم السؤال أو اسم التمرين (مثلاً: س 5 ص 24)..." onkeypress="checkEnter(event)">
            <button class="send-btn" onclick="sendCustomQuery()">➤</button>
        </div>
    </div>

    <script>
        function checkEnter(e) { if (e.key === 'Enter') sendCustomQuery(); }

        function showChapterExercises(chNum) {
            const container = document.getElementById('messagesContainer');
            const msg = document.createElement('div');
            msg.className = 'message incoming';

            if(chNum === 1) {
                msg.innerHTML = `
                    <span class="sender">📚 حلول تمارين الفصل الأول: الجبر والأسس</span>
                    <div class="content">
                        اختر تمريناً لعرض الحل المفصل:
                        <div class="solution-box">
                            <button class="exercise-btn" onclick="showSolution('أوجد قيمة: $3^4$', ['الأس يعني تكرار ضرب الأساس في نفسه.', '$3^4 = 3 \\times 3 \\times 3 \\times 3$', 'الناتج = 81'])">تمرين القوى والأسس ($3^4$)</button>
                            <button class="exercise-btn" onclick="showSolution('احسب ناتج: $5 + 3 \\times (2 + 4)$', ['1. الأقواس أولاً: $(2 + 4) = 6$', '2. الضرب: $3 \\times 6 = 18$', '3. الجمع: $5 + 18 = 23$'])">ترتيب العمليات الحسابية</button>
                            <button class="exercise-btn" onclick="showSolution('احسب قيمة العبارة الجبرية: $4x + 3$ إذا كانت $x = 5$', ['1. استبدل المتغير $x$ بقيمته (5): $4(5) + 3$', '2. اضرب أولاً: $4 \\times 5 = 20$', '3. اجمَع: $20 + 3 = 23$'])">العبارات الجبرية</button>
                        </div>
                    </div>
                `;
            } else if(chNum === 2) {
                msg.innerHTML = `
                    <span class="sender">📚 حلول تمارين الفصل الثاني: الإحصاء</span>
                    <div class="content">
                        اختر تمريناً لعرض الحل المفصل:
                        <div class="solution-box">
                            <button class="exercise-btn" onclick="showSolution('أوجد المتوسط الحسابي للقيم: 8, 12, 10, 14', ['1. نجمع الأقيم: $8 + 12 + 10 + 14 = 44$', '2. نقسم المجموع على عددها (4): $44 \\div 4$', '3. المتوسط الحسابي = 11'])">المتوسط الحسابي</button>
                            <button class="exercise-btn" onclick="showSolution('أوجد الوسيط والمنوال للقيم: 5, 2, 9, 5, 7', ['1. نرتب القيم تصاعدياً: 2, 5, 5, 7, 9', '2. الوسيط (القيمة المتوسطة) = 5', '3. المنوال (الأكثر تكراراً) = 5'])">الوسيط والمنوال</button>
                        </div>
                    </div>
                `;
            } else {
                msg.innerHTML = `
                    <span class="sender">📚 حلول تمارين الفصل الثالث: الكسور</span>
                    <div class="content">
                        اختر تمريناً لعرض الحل المفصل:
                        <div class="solution-box">
                            <button class="exercise-btn" onclick="showSolution('اكتب الكسر الغير فعلي $\\frac{9}{4}$ على صورة عدد كسري', ['1. نقسم البسط على المقام: $9 \\div 4 = 2$ والباقي 1', '2. الناتج الصحيح يكون هو العدد الكلي (2)', '3. الباقي يصبح بسطاً والمقام يبقى كما هو ($1/4$)', '4. النتيجة النهائية = $2\\frac{1}{4}$'])">الكسور غير الفعلية والأعداد الكسرية</button>
                            <button class="exercise-btn" onclick="showSolution('أوجد ناتج جمع: $\\frac{1}{3} + \\frac{1}{6}$', ['1. وحد المقامات للمضاعف المشترك الأصغر (6).', '2. اضرب الكسر الأول في 2: $\\frac{2}{6}$', '3. اجمع البسطين: $\\frac{2}{6} + \\frac{1}{6} = \\frac{3}{6}$', '4. في أبسط صورة ($1/2$): القسمة على 3'])">جمع الكسور وطرحها</button>
                        </div>
                    </div>
                `;
            }
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function showSolution(title, stepsArray) {
            const container = document.getElementById('messagesContainer');
            const msg = document.createElement('div');
            msg.className = 'message incoming';
            
            let stepsHtml = '';
            stepsArray.forEach((step, index) => {
                stepsHtml += `<div class="step-item"><b>الخطوة ${index + 1}:</b> ${step}</div>`;
            });

            msg.innerHTML = `
                <span class="sender">الشرح والحل النموذجي 📝</span>
                <div class="content">
                    <b>السؤال:</b> ${title}
                    <div class="solution-box">
                        ${stepsHtml}
                    </div>
                </div>
            `;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function sendCustomQuery() {
            const input = document.getElementById('messageInput');
            const container = document.getElementById('messagesContainer');
            if(input.value.trim() === '') return;

            const uMsg = document.createElement('div');
            uMsg.className = 'message outgoing';
            uMsg.innerHTML = `<span class="sender">الطالب</span><div class="content">${input.value}</div>`;
            container.appendChild(uMsg);

            const text = input.value;
            input.value = '';
            container.scrollTop = container.scrollHeight;

            setTimeout(() => {
                const bMsg = document.createElement('div');
                bMsg.className = 'message incoming';
                bMsg.innerHTML = `
                    <span class="sender">المعلم الذكي 🤖</span>
                    <div class="content">
                        تم استلام مسألتك: <b>"${text}"</b>.<br>
                        الحل النموذجي المعتمد يقتضي تطبيق القاعدة الرياضية الصحيحة خطوة بخطوة كما وردت في كتاب الطالب، مع التأكد من صحة العمليات الحسابية والتحقق من المعقولية.
                    </div>
                `;
                container.appendChild(bMsg);
                container.scrollTop = container.scrollHeight;
            }, 900);
        }

        function filterContent() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            document.querySelectorAll('.message').forEach(msg => {
                msg.style.display = msg.innerText.toLowerCase().includes(query) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
